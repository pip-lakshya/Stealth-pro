<!doctype html>
<html>
<head>
  <style>
    body{width:300px;padding:14px;font:14px Arial;color:#18232d}
    label{display:block;font-weight:bold;margin-top:10px}
    textarea,select{box-sizing:border-box;width:100%;margin-top:5px;padding:7px}
    textarea{height:68px}
    button{width:100%;padding:9px;margin-top:9px;border:0;border-radius:5px;background:#087b6e;color:#fff;font-weight:bold}
    .off{background:#a12b2b}
    small{color:#66717c}
    #modelInfo{display:block;margin-top:5px;line-height:1.35}
    #status{min-height:18px;margin-top:8px;color:#087b6e;font-weight:bold}
  </style>
</head>
<body>
  <label>Provider</label>
  <select id="provider">
    <option value="auto">Auto: Gemini then NVIDIA</option>
    <option value="nvidia">NVIDIA only</option>
    <option value="gemini">Gemini only</option>
  </select>
  <label for="geminiModel">Gemini model</label>
  <select id="geminiModel">
    <option value="gemini-2.5-flash">Gemini 2.5 Flash - Recommended</option>
    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite - Fastest</option>
    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite - Fast / low quota</option>
    <option value="gemini-3-flash-preview">Gemini 3 Flash - Higher capability (preview)</option>
    <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite - Fast / efficient</option>
    <option value="gemini-3.6-flash">Gemini 3.6 Flash - Balanced multimodal</option>
    <option value="gemini-3.8-flash">Gemini 3.8 Flash - Highest capability</option>
  </select>
  <small id="modelInfo"></small>
  <label>NVIDIA API keys</label>
  <textarea id="nvidia" placeholder="One key per line"></textarea>
  <label>Gemini API keys</label>
  <textarea id="gemini" placeholder="One key per line"></textarea>
  <small>Each provider tries its saved keys in order. Only vision-capable text-output models are listed because the extension sends a screenshot.</small>
  <button id="save">Save settings</button>
  <button id="solve">Solve screen</button>
  <button id="toggle">Show / hide answer</button>
  <button id="enabled" class="off"></button>
  <div id="status" role="status"></div>
  <small>Shortcuts: Ctrl+Shift+S solve, Ctrl+Shift+H hide/show.</small>
  <script src="popup.js"></script>
</body>
</html>
